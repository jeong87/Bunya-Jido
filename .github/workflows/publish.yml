name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Verify and build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build twine
      - name: Match release tag to package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(python -c 'from bunya_jido import __version__; print(__version__)')"
          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}"
      - name: Run release gate
        run: |
          python -m unittest discover -s tests
          python -m bunya_jido diagnose --root . --require-grounded --json
          python -m bunya_jido evaluate-agent-utility --root . --require-pass --json
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Smoke installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/bunya-jido-wheel-smoke"
          "$RUNNER_TEMP/bunya-jido-wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/bunya-jido-wheel-smoke/bin/python" -m pip install dist/*.whl
          SMOKE_BIN="$RUNNER_TEMP/bunya-jido-wheel-smoke/bin/bunya-jido"
          SMOKE_ROOT="$RUNNER_TEMP/bunya-jido-release-smoke-root"
          mkdir -p "$SMOKE_ROOT"
          git archive HEAD | tar -x -C "$SMOKE_ROOT"
          "$SMOKE_BIN" --version
          "$SMOKE_BIN" prepare --root "$SMOKE_ROOT" --quiet
          "$SMOKE_BIN" validate-blueprint --root "$SMOKE_ROOT"
          "$SMOKE_BIN" validate-agent-map --root "$SMOKE_ROOT"
          "$SMOKE_BIN" build --root "$SMOKE_ROOT" --out "$SMOKE_ROOT/bunya-jido.html"
          "$SMOKE_BIN" context --root "$SMOKE_ROOT" --task "debug task context routing" --json --out "$RUNNER_TEMP/bunya-jido-context-smoke.json"
          "$SMOKE_BIN" install-agent-guides --root "$SMOKE_ROOT" --agent all --activate
          "$SMOKE_BIN" install-agent-guides --root "$SMOKE_ROOT" --agent all --deactivate
          "$SMOKE_BIN" diagnose --root "$SMOKE_ROOT" --require-grounded
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bunya-jido
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
